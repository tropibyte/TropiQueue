# TropiQueue sample configuration.
#
# Copy this file to tropiqueue.conf (or point tqd at it with --config) and
# adjust it. Keys that are commented out show their default value.
# `tqd --sample-config` prints every key; `tqd --check-config` validates a file.

## ------------------------------------------------------------------ node

node.name = tropiqueue@localhost
data_dir = ./data
# node.id = 1
# pid_file = /run/tropiqueue/tqd.pid

## ------------------------------------------------------------- listeners

listeners.tcp.default = 5672
# listeners.max_connections_per_ip = 0
# num_io_threads = 2
# connection_max = 65536

## -------------------------------------------------------------- protocol

# channel_max = 2047
# frame_max = 128KB
# heartbeat = 60
# max_message_size = 128MB
# handshake_timeout = 10s
consumer_timeout = 30m

## -------------------------------------------------------- authentication

# The default user is created on first start only (password "guest" unless
# default_pass is set). Read real passwords from the environment instead of
# storing them here.
default_user = guest
# default_pass = $(TQ_DEFAULT_PASS)
default_vhost = /
loopback_users = guest
# auth_mechanisms = PLAIN, AMQPLAIN

# OAuth 2.0 access tokens (JWT, HS256)
# auth_oauth2.enabled = true
# auth_oauth2.resource_server_id = tropiqueue
# auth_oauth2.issuer = https://idp.example.com/
# auth_oauth2.default_key = $(TQ_JWT_KEY)
# auth_oauth2.signing_keys.key-2024 = $(TQ_JWT_KEY_2024)
# auth_oauth2.leeway = 60

## ------------------------------------------------------------- resources

vm_memory_high_watermark.relative = 0.4
# vm_memory_high_watermark.absolute = 2GB
# tick_interval = 1s
# store.sync_interval = 200ms
# store.segment_size = 16MB

## ------------------------------------------------------------ management

management.enabled = true
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
management.www_dir = www
# management.cors.allow_origins = https://ops.example.com

## ------------------------------------------------------------ clustering

# cluster.enabled = true
# cluster.nodes = 1@mq-01:25672, 2@mq-02:25672, 3@mq-03:25672
# cluster.port = 25672
# cluster.cookie = $(TQ_CLUSTER_COOKIE)

## ------------------------------------------------------- other protocols

# mqtt.enabled = true
# mqtt.listeners.tcp.default = 1883
# mqtt.vhost = /
# mqtt.allow_anonymous = false

# stomp.enabled = true
# stomp.listeners.tcp.default = 61613

# stream.enabled = true
# stream.listeners.tcp.default = 5552
# stream.advertised_host = mq-01.internal
# stream.frame_max = 1MB

## -------------------------------------------------------------- features

# event_exchange.enabled = true
# shovel.enabled = true
# federation.enabled = true

## --------------------------------------------------------------- logging

log.level = info
# log.file = /var/log/tropiqueue/tqd.log
